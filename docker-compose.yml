services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: legalai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-legalai}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-legalai_dev_password}
      POSTGRES_DB: ${DB_NAME:-legalai}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/src/db/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-legalai}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
